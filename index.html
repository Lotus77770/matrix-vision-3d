<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线性变换可视化</title>
  </head>
  <body>
    <!-- 全屏场景（始终显示，3D 画面铺满整个窗口） -->
    <div id="stage"></div>

    <!-- 唯一的 3D 视口（内含 canvas），始终位于场景中 -->
    <div id="viewport"></div>

    <!-- 线性变换控制台：浮在场景之上的固定面板（左上角），可收缩为一个折叠按钮 -->
    <div id="console">
      <button
        id="console-toggle"
        type="button"
        title="展开 / 收起控制台"
        aria-expanded="true"
        aria-controls="console-card"
      >
        <!-- 折叠方向指示：展开时为 «（收起），收起后旋转 180° 变为 »（展开） -->
        <svg
          class="chev"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="13,5 7,12 13,19" />
          <polyline points="19,5 13,12 19,19" />
        </svg>
      </button>
      <section id="console-card">
        <h1>线性变换控制台</h1>
        <p class="subtitle">调节 3×3 矩阵，实时作用于基向量与立方格阵</p>
        <div id="matrix" class="matrix"></div>
        <div class="matrix-actions">
          <button id="reset-btn" type="button">重置为单位矩阵</button>
        </div>
        <div class="grid-toggles">
          <span class="grid-toggles-title">网格线显示</span>
          <label class="grid-toggle">
            <input type="checkbox" data-grid-axis="x" checked />
            <span class="track"><span class="thumb"></span></span>
            <span class="name">X 向网格线</span>
          </label>
          <label class="grid-toggle">
            <input type="checkbox" data-grid-axis="y" checked />
            <span class="track"><span class="thumb"></span></span>
            <span class="name">Y 向网格线</span>
          </label>
          <label class="grid-toggle">
            <input type="checkbox" data-grid-axis="z" checked />
            <span class="track"><span class="thumb"></span></span>
            <span class="name">Z 向网格线</span>
          </label>
        </div>
        <div class="vector-section">
          <div class="vector-section-head">
            <span class="vector-section-title">向量列表</span>
            <button id="add-vector-btn" type="button">添加向量</button>
          </div>
          <div id="vector-list" class="vector-list"></div>
        </div>
      </section>
    </div>

    <div class="hint">
      Alt + 拖拽 旋转　｜　Alt + 滚轮 缩放　｜　W A S D 移动
    </div>

    <!-- 鼠标悬停基向量时显示的坐标提示 -->
    <div id="vector-tooltip"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
